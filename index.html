<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B8457" />
  <meta name="description" content="TokOnline.com — Marketplace lokal modern 2026. Belanja dari toko, warung, UMKM, dan kuliner di sekitar kamu." />
  <meta property="og:title" content="TokOnline — Belanja Lokal, Cepat, Terpercaya" />
  <meta property="og:description" content="Marketplace lokal modern 2026. Belanja dari toko di sekitar kamu." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TokOnline" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/main.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <title>TokOnline — Marketplace Lokal 2026</title>
</head>
<body>
  <!-- App shell: router akan inject halaman ke sini -->
  <div id="app" class="app-shell">
    <!-- Skeleton loading awal sebelum JS hydration -->
    <div class="boot-splash" id="boot-splash">
      <div class="boot-splash__logo">TOK<span>Online</span></div>
      <div class="boot-splash__spinner" aria-label="Memuat"></div>
      <p class="boot-splash__hint">Menyiapkan toko-toko lokal untukmu…</p>
    </div>
  </div>

  <!-- Toast container (global notification) -->
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <!-- Modal container (global) -->
  <div id="modal-root" class="modal-root" aria-hidden="true"></div>

  <!-- Entry point: Vanilla JS modular app -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
